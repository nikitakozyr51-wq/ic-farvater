<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — ИК Фарватер</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header__inner">
      <a href="../index.html" class="header__logo">ИК Фарватер</a>
      <nav class="header__nav">
        <a href="../index.html" class="header__link">Главная</a>
        <a href="about.html" class="header__link">О компании</a>
        <a href="products.html" class="header__link">Продукты</a>
        <a href="services.html" class="header__link">Услуги</a>
        <a href="contacts.html" class="header__link header__link--active">Контакты</a>
      </nav>
      <div class="header__actions">
        <a href="products.html" class="header__link">Поиск</a>
      </div>
      <button class="header__burger" aria-label="Меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Contacts -->
  <section class="hero">
    <div class="container">
      <h1 class="hero__title">Контакты</h1>
      <p class="hero__subtitle">Свяжитесь с нами</p>
    </div>
  </section>

  <section class="section">
    <div class="container layout-split">
      <div>
        <h3>Напишите нам</h3>
        <form id="contactForm">
          <div style="margin-bottom: var(--space-4);">
            <label for="name" style="display: block; margin-bottom: var(--space-2); font-weight: var(--font-medium);">Имя</label>
            <input type="text" id="name" name="name" class="search__input" style="max-width: 100%; padding-left: var(--space-4);" required>
          </div>
          <div style="margin-bottom: var(--space-4);">
            <label for="email" style="display: block; margin-bottom: var(--space-2); font-weight: var(--font-medium);">Email</label>
            <input type="email" id="email" name="email" class="search__input" style="max-width: 100%; padding-left: var(--space-4);" required>
          </div>
          <div style="margin-bottom: var(--space-4);">
            <label for="message" style="display: block; margin-bottom: var(--space-2); font-weight: var(--font-medium);">Сообщение</label>
            <textarea id="message" name="message" rows="5" class="search__input" style="max-width: 100%; padding-left: var(--space-4); border-radius: var(--radius-md); resize: vertical;" required></textarea>
          </div>
          <button type="submit" class="btn btn--primary">Отправить</button>
        </form>
      </div>
      <div>
        <h3>Наши контакты</h3>
        <p>Адрес, телефон и email будут добавлены позже.</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        &copy; 2026 ИК Фарватер. Все права защищены.
      </div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
