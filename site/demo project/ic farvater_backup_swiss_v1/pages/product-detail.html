<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Продукт — ИК Фарватер</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header__inner">
      <a href="../index.html" class="header__logo">ИК Фарватер</a>
      <nav class="header__nav">
        <a href="../index.html" class="header__link">Главная</a>
        <a href="about.html" class="header__link">О компании</a>
        <a href="products.html" class="header__link header__link--active">Продукты</a>
        <a href="services.html" class="header__link">Услуги</a>
        <a href="contacts.html" class="header__link">Контакты</a>
      </nav>
      <div class="header__actions">
        <a href="products.html" class="header__link">Поиск</a>
      </div>
      <button class="header__burger" aria-label="Меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Product Detail -->
  <section class="section">
    <div class="container">
      <div class="layout-split">
        <div>
          <!-- Product image -->
          <div class="card__image" style="aspect-ratio: 4/3; background: var(--color-bg-alt); border-radius: var(--radius-md);"></div>
        </div>
        <div>
          <h1>Название продукта</h1>
          <p>Описание продукта будет добавлено.</p>

          <h3 style="margin-top: var(--space-8);">Характеристики</h3>
          <table style="width: 100%; margin-top: var(--space-4);">
            <tr style="border-bottom: 1px solid var(--color-border);">
              <td style="padding: var(--space-3) 0; color: var(--color-text-muted);">Параметр</td>
              <td style="padding: var(--space-3) 0;">Значение</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        &copy; 2026 ИК Фарватер. Все права защищены.
      </div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
